<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalogue Chaussure</title>
    <meta name="description" content="Catalogue" />
    <script defer src="js/menu.js"></script>
    <link rel="stylesheet" href="css/" />
  </head>
  <body>
    <header class="header">
      <p class="logo gras">foulée</p>
      <nav class="nav-menu" aria-label="Navigation principale">
        <!-- Bouton Menu / Fermer -->
        <button
          class="nav-menu__toggle"
          aria-expanded="false"
          aria-controls="nav-menu-list"
          aria-label="Ouvrir le menu de navigation"
        >
          <!-- L'icône doit être positionnée en premier pour le sélecteur CSS adjacent (+) -->
          <span class="nav-menu__hamburger-icon" aria-hidden="true"></span>
          <span class="nav-menu__libelle">Menu</span>
        </button>

        <!-- Liste des liens de navigation -->
        <ul id="nav-menu-list" class="nav-menu__list">
          <li class="nav-menu__item">
            <a href="#hommes" class="nav-menu__link">Hommes</a>
          </li>
          <li class="nav-menu__item">
            <a href="#femmes" class="nav-menu__link">Femmes</a>
          </li>
          <li class="nav-menu__item">
            <a href="#enfants" class="nav-menu__link">Enfants</a>
          </li>
          <li class="nav-menu__item">
            <a href="#sport" class="nav-menu__link">Sport</a>
          </li>
          <li class="nav-menu__item">
            <a href="#personnaliser" class="nav-menu__link">Personnaliser</a>
          </li>
          <li class="nav-menu__item">
            <a href="#foulée" class="nav-menu__link"
              >foulée <span>&#43;</span></a
            >
          </li>
        </ul>
      </nav>
      <div class="recherche">
        <form class="barre_de_recherche">
          <input type="search" placeholder="Rechercher" />
          <button type="submit" class="bouton_icon">
            <img src="images/Loupe.svg" alt="icon_rechrche" />
          </button>
        </form>
      </div>
      <button type="button" class="bouton_panier">
        <img src="images/Panier.png" alt="icon_panier" />
      </button>
    </header>
    <main class="contenu">
      <p class="fil_dariane">
        Accueil <span class="symbole gras">&#10095;</span> Chaussures
      </p>
      <h1 class="titre">Chaussures</h1>
      <p class="texte">12 produits</p>
      <ul class="categories__list">
        <li class="categorie__list-item">
          <a class="categorie__link gras" href="">Tous</a>
        </li>
        <li class="categorie__list-item">
          <a class="categorie__link gras" href="">Hommes</a>
        </li>
        <li class="categorie__list-item">
          <a class="categorie__link gras" href="">Femmes</a>
        </li>
        <li class="categorie__list-item">
          <a class="categorie__link gras" href="">Enfants</a>
        </li>
      </ul>
      <div class="filtres">
        <img src="images/filtre-icon.png" alt="icon_filtres" />
        <p class="texte gras">Masquer les filtres</p>
      </div>
      <div class="trie">
        <label for="pet-select">Trier par</label>
        <select name="pets" id="pet-select">
          <option value="">Nouveautés</option>
        </select>
      </div>
      <fieldset class="filtres_sport">
        <legend class="filtres gras">Sport</legend>
        <div>
          <input type="checkbox" id="course" name="sport" value="course" />
          <label for="course">Course</label>
        </div>
        <div>
          <input type="checkbox" id="basketball" name="sport" value="basketball" />
          <label for="basketball">Basketball</label>
        </div>
        <div>
          <input type="checkbox" id="football" name="sport" value="football" />
          <label for="football">Football</label>
        </div>
        <div>
          <input type="checkbox" id="training" name="sport" value="training" />
          <label for="training">Training</label>
        </div>
        <div>
          <input type="checkbox" id="lifestyle" name="sport" value="lifestyle" />
          <label for="lifestyle">Lifestyle</label>
        </div>
      </fieldset>
      <fieldset class="filtres_prix">
        <legend class="filtres gras">Prix</legend>
        <div>
          <input type="checkbox" id="valeur01" name="prix" value="valeur01" />
          <label for="valeur01">Moins de 80 $</label>
        </div>
        <div>
          <input type="checkbox" id="valeur02" name="prix" value="valeur02" />
          <label for="valeur02">80 $ - 120 $</label>
        </div>
        <div>
          <input type="checkbox" id="valeur03" name="prix" value="valeur03" />
          <label for="valeur03">120 $ - 180 $</label>
        </div>
        <div>
          <input type="checkbox" id="valeur04" name="prix" value="valeur04" />
          <label for="valeur04">Plus de 180 $</label>
        </div>
      </fieldset>
      <fieldset class="filtres_couleur">
        <legend class="filtres gras">Couleur</legend>
        <div>
          <input type="checkbox" id="Blanc" name="couleur" value="Blanc" />
          <label for="Blanc">Blanc</label>
        </div>
        <div>
          <input type="checkbox" id="Noir" name="couleur" value="Noir" />
          <label for="Noir">Noir</label>
        </div>
        <div>
          <input type="checkbox" id="Rouge" name="couleur" value="Rouge" />
          <label for="Rouge">Rouge</label>
        </div>
        <div>
          <input type="checkbox" id="Bleu" name="couleur" value="Bleu" />
          <label for="Bleu">Bleu</label>
        </div>
        <div>
          <input type="checkbox" id="Jaune" name="couleur" value="Jaune" />
          <label for="Jaune">Jaune</label>
        </div>
        <div>
          <input type="checkbox" id="Gris" name="couleur" value="Gris" />
          <label for="Gris">Gris</label>
        </div>
      </fieldset>
      <fieldset class="filtres_pointure">
        <legend class="filtres gras">Pointure</legend>
        <div>
          <input type="checkbox" id="01valeur" name="pointure" value="01valeur" />
          <label for="01valeur">36</label>
        </div>
        <div>
          <input type="checkbox" id="02valeur" name="pointure" value="02valeur" />
          <label for="02valeur">37</label>
        </div>
        <div>
          <input type="checkbox" id="03valeur" name="pointure" value="03valeur" />
          <label for="03valeur">38</label>
        </div>
        <div>
          <input type="checkbox" id="04valeur" name="pointure" value="04valeur" />
          <label for="04valeur">39</label>
        </div>
        <div>
          <input type="checkbox" id="05valeur" name="pointure" value="05valeur" />
          <label for="05valeur">40</label>
        </div>
        <div>
          <input type="checkbox" id="06valeur" name="pointure" value="06valeur" />
          <label for="06valeur">41</label>
        </div>
        <div>
          <input type="checkbox" id="07valeur" name="pointure" value="07valeur" />
          <label for="07valeur">42</label>
        </div>
        <div>
          <input type="checkbox" id="08valeur" name="pointure" value="08valeur" />
          <label for="08valeur">43</label>
        </div>
        <div>
          <input type="checkbox" id="09valeur" name="pointure" value="09valeur" />
          <label for="09valeur">44</label>
        </div>
        <div>
          <input type="checkbox" id="10valeur" name="pointure" value="10valeur" />
          <label for="10valeur">45</label>
        </div>
      </fieldset>
      <section class="Chaussures">
        <div class="chaussure">
          <p class="nouveau gras">Nouveau</p>
          
        </div>
      </section>
    </main>
  </body>
</html>
